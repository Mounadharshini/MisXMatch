server:
  port: 8080

spring:
  application:
    name: gateway-service
  codec:
    max-in-memory-size: 50MB
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST
      routes:
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/aadhaar/**,/api/organizations/**,/api/admin/users/**,/api/admin/organizations/**
          filters:
            - StripPrefix=1

        - id: case-service
          uri: http://${CASE_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/cases/**,/api/cases,/api/reports/**,/api/reports,/api/sightings/**,/api/sightings,/api/evidence/**,/api/evidence,/api/ai-safety/**,/api/ai/**,/api/admin/cases/**,/api/admin/ai/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: http://${NOTIFICATION_SERVICE_HOST:localhost}:8084
          predicates:
            - Path=/api/notifications/**,/api/dashboard/**,/api/audit-logs/**,/api/admin/system/**
          filters:
            - StripPrefix=1

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1:5173,http://127.0.0.1:80}

jwt:
  secret: ${JWT_SECRET:misxmatch-super-secret-signing-key-change-in-prod-2026-01}

logging:
  level:
    org.springframework.cloud.gateway: INFO
