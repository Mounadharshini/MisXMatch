server:
  port: 8083

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: case-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/case_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:${MYSQL_USER:root}}
    password: ${DB_PASSWORD:${MYSQL_ROOT_PASSWORD:Mouna@182}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
        use_sql_comments: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com

jwt:
  secret: ${JWT_SECRET:misxmatch-super-secret-signing-key-change-in-prod-2026-01}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

otp:
  mode: ${OTP_MODE:development}
  expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  mail-from: ${OTP_MAIL_FROM:no-reply@misxmatch.org}

ai:
  matching:
    provider: real
    max-candidates: 5
  service:
    url: ${AI_SERVICE_URL:http://${AI_SERVICE_HOST:127.0.0.1}:${AI_SERVICE_PORT:8000}}
    connect-timeout-ms: 5000
    read-timeout-ms: 15000

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:misxmatch-uploads}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:8080/api/cases/files}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
