server:
  port: 8081

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: auth-service
  codec:
    max-in-memory-size: 20MB
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:${MYSQL_USER:root}}
    password: ${DB_PASSWORD:${MYSQL_ROOT_PASSWORD:Mouna@182}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
        use_sql_comments: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dhachumaa182@gmail.com}
    password: ${MAIL_PASSWORD:dxogswnkvdbedpsy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com

jwt:
  secret: ${JWT_SECRET:misxmatch-super-secret-signing-key-change-in-prod-2026-01}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

otp:
  mode: ${OTP_MODE:production}
  expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  mail-from: ${OTP_MAIL_FROM:dhachumaa182@gmail.com}

aadhaar:
  mode: ${AADHAAR_MODE:demo}
  provider: ${AADHAAR_PROVIDER:uidai}
  uidai:
    client-id: ${UIDAI_CLIENT_ID:}
    client-secret: ${UIDAI_CLIENT_SECRET:}
    api-url: ${UIDAI_API_URL:}
  otp-expiry-minutes: ${AADHAAR_OTP_EXPIRY_MINUTES:5}
  max-attempts: ${AADHAAR_MAX_ATTEMPTS:5}
  resend-cooldown-seconds: ${AADHAAR_RESEND_COOLDOWN_SECONDS:60}

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}
  reset-token:
    expiry-minutes: ${RESET_TOKEN_EXPIRY_MINUTES:15}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.misxmatch.auth: INFO
